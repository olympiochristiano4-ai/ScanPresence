<!doctype html>
<html lang="fr">
  <head >
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="inscription.css">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page d'inscription">
    <title>ScanPresence | Inscrivez-vous</title>
  </head>
  <body>
  <main class="authentification">
  <section class="authentification__panneau-formulaire">
     <h1>Inscrivez-vous</h1>
    <form action="inscription.php" method="post">
      
      <div class="authentification__champ">
      <label for="nom">Nom:</label><br>
      <input type="text" id="nom" name="nom"><br>
      </div>

      <div class="authentification__champ">
      <label for="prenom">Prénom:</label><br>
      <input type="text" id="prenom" name="prenom"><br>
      </div>

      <div class="authentification__champ">
      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email"><br>
      </div>

      <div class="authentification__champ">
      <label for="matricule">Matricule:</label><br>
      <input type="text" id="matricule" name="matricule"><br>
      </div>

      <div class="authentification__champ">
      <label for="motdepasse">Mot de passe:</label><br>
      <input type="password" id="motdepasse" name="motdepasse"><br>
      </div>

      <div class="authentification__champ">
      <label for="confirmation">Confirmez le mot de passe:</label>
      <br>
      <input type="password" id="confirmation" name="confirmation">
      <br>
      </div>
      
      <button type="submit">S'inscrire</button>
      
    </form>

<p>Vous avez déjà un compte? <a href="connexion.html">Connectez-vous</a></p>
    
  </section>

    <section class="authentification__panneau-marque">
      <h2>ScanPresence</h2>
      <div class="authentification__logo"></div>
    </section>
    
  </main>
  </body>
</html>
